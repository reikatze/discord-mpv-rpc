# mpv Discord Rich Presence - script-opts/discord-mpv-rpc.conf
# Place this file in your mpv script-opts directory:
#   Windows (standard): %APPDATA%\\mpv\\script-opts\\discord-mpv-rpc.conf
#   Windows (portable): <mpv_dir>\\portable_config\\script-opts\\discord-mpv-rpc.conf
#   Linux/macOS: ~/.config/mpv/script-opts/discord-mpv-rpc.conf
#
# Script + cache live together:
#   .../scripts/discord-mpv-rpc/main.lua
#   .../scripts/discord-mpv-rpc/discord-mpv-rpc-posters.json

# Required: Discord application ID from
# https://discord.com/developers/applications
client_id=

# Optional: TMDb API key for poster images
# https://www.themoviedb.org/settings/api
tmdb_api_key=

# TMDb response language (default: en-US)
tmdb_language=en-US

# Seconds between background presence refreshes while playing (default: 15).
# Pause, seek, and new-file updates are always sent immediately.
update_interval=15

# Key to toggle Rich Presence on/off (default: D)
key_toggle=D

# Fallback Discord asset key when no TMDb poster is found
# Upload this image under Rich Presence -> Art Assets in the Developer Portal
large_image=mpv
large_text=mpv

# Corner badge on the poster. Upload assets with these keys
# under Rich Presence -> Art Assets (or leave empty to hide).
small_image_playing=play
small_image_paused=pause
small_image_idle=mpv

# How to fit TMDb posters into Discord's square large_image:
#   contain - letterbox on a dark square (full poster, no crop)
#   raw     - original portrait URL (Discord will crop the middle)
poster_fit=contain

# Start with Rich Presence enabled (yes/no)
enabled=yes
