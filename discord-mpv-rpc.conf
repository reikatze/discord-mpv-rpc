# discord-mpv-rpc configuration
# Install as script-opts/discord-mpv-rpc.conf.
# Install main.lua as scripts/discord-mpv-rpc/main.lua, with the modules, db,
# and tools folders beside it.
#
# Config locations:
#   Windows: %APPDATA%\mpv\script-opts\discord-mpv-rpc.conf
#   Portable Windows: <mpv_dir>\portable_config\script-opts\discord-mpv-rpc.conf
#   Linux/macOS: ~/.config/mpv/script-opts/discord-mpv-rpc.conf
#
# Presence updates are event-driven. IPC reads, reconnects, and local TMDb
# database maintenance run independently of presence updates.

# Optional: leave empty to use the built-in Application ID.
# Set client_id to your own Discord Application ID to override it.
# https://discord.com/developers/applications
client_id=

# Optional: leave empty to disable TMDb artwork and metadata requests.
# https://www.themoviedb.org/settings/api
tmdb_api_key=

# Language for TMDb searches and metadata.
tmdb_language=en-US

# Look up the exact parsed TV season/episode; no season remapping.
tmdb_episode_lookup=yes

# Use the optional local TMDb database and maintain it automatically.
# When enabled, a LuaJIT-enabled mpv worker downloads and rebuilds the database
# only when it is missing, corrupted, or at least seven days old.
# Online TMDb search remains available while a build is running or after a
# maintenance failure. Set to no to disable both database lookup and automatic
# maintenance.
tmdb_local_index=yes

# Key binding to toggle local TMDb database lookup and maintenance for the
# current mpv session. This does not rewrite this configuration file or stop an
# update worker that is already running. Leave empty to disable the shortcut.
key_toggle_db=Ctrl+d

# Optional full path to a LuaJIT-enabled mpv executable for the background
# database worker. Leave empty to discover the running mpv executable.
# This is normally needed only for unusual or embedded installations.
# Example on Windows: C:\Apps\mpv\mpv.exe
# Example on Linux/macOS: /usr/local/bin/mpv
tmdb_index_mpv_path=

# Successful TMDb metadata is refreshed after this many days.
tmdb_positive_cache_days=60

# Persistent metadata cache path. Leave empty to store
# discord-mpv-rpc-posters.json beside main.lua in the script directory.
# mpv path prefixes such as ~~ are supported.
cache_path=

# Key binding to enable/disable Rich Presence.
key_toggle=D

# Fallback Discord art asset and its hover text.
# Upload the image under your application's Rich Presence art assets.
large_image=mpv
large_text=mpv

# Optional corner badges. Upload these asset keys, or leave a value empty
# to hide that badge. Cache buffering uses the paused badge.
small_image_playing=play
small_image_paused=pause
small_image_idle=mpv

# Artwork fitting:
#   contain: use wsrv.nl to letterbox artwork into a 512x512 square.
#            Sends the TMDb image URL to this third-party service.
#            Falls back to the raw image when the availability probe fails.
#   raw: send the original TMDb image URL directly; Discord may crop it.
poster_fit=contain

# Start with Rich Presence enabled. Press key_toggle to change at runtime.
enabled=yes
